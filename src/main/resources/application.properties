spring.application.name=UrbanEye Backend

server.port=${PORT:8080}

# ── Database ─────────────────────────────────────────────────────
# Uses env variable if set (Railway/Docker), falls back to local defaults
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/urbaneye_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:23FE1A0424}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool ──────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:VXJiYW5FeWVBSVNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uQmFja2VuZDIwMjY=}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ── External APIs ─────────────────────────────────────────────────
weather.api.key=${WEATHER_API_KEY:mock_key}

# ── Logging ───────────────────────────────────────────────────────
logging.level.com.urbaneye=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# ── JSON ──────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
