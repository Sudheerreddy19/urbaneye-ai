spring.application.name=UrbanEye Backend

server.port=${PORT:8080}



spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:urbaneye_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000



spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.security.police-key=${POLICE_PROVISION_KEY:${POLICE_SECRET_KEY:POLICE_SECURE_2026}}
app.security.hospital-key=${HOSPITAL_PROVISION_KEY:${HOSPITAL_SECRET_KEY:HOSPITAL_SECURE_2026}}
app.security.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.security.lock-duration-minutes=${LOCK_DURATION_MINUTES:15}

weather.api.key=${WEATHER_API_KEY:mock_key}

logging.level.com.urbaneye=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN


spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
